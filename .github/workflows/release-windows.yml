name: Release Windows ZIPs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to upload assets to
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standard Windows ZIP
        shell: pwsh
        run: |
          npm run release:win
          New-Item -ItemType Directory -Force -Path dist-electron/release-assets | Out-Null
          Get-ChildItem -Path dist-electron/release -Filter 'ClaroIA-*-win-x64.zip' |
            Where-Object { $_.Name -notlike '*privacy-bundled*' } |
            Copy-Item -Destination dist-electron/release-assets/

      - name: Build privacy-bundled Windows ZIP
        shell: pwsh
        run: |
          npm run release:win:privacy-bundled
          Get-ChildItem -Path dist-electron/release -Filter 'ClaroIA-*-privacy-bundled-win-x64.zip' |
            Copy-Item -Destination dist-electron/release-assets/

      - name: Ensure release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            || gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ClaroIA $env:RELEASE_TAG" --notes "Windows portable release assets."

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload $env:RELEASE_TAG dist-electron/release-assets/*.zip --repo $env:GITHUB_REPOSITORY --clobber
